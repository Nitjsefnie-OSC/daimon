# Sanitized shape from Cloud Run's v1 job YAML and secret-alias examples:
# https://docs.cloud.google.com/run/docs/reference/yaml/v1#cloud_run_job_yaml
# https://docs.cloud.google.com/run/docs/configuring/jobs/secrets#yaml
apiVersion: run.googleapis.com/v1
kind: Job
metadata:
  name: staging-daimon-migrate
  namespace: '1234567890'
spec:
  template:
    metadata:
      annotations:
        run.googleapis.com/cloudsql-instances: pymc-daimon-staging:us-east1:database
        run.googleapis.com/secrets: database-url:projects/1234567890/secrets/database-url,unused:projects/1234567890/secrets/unrelated
        run.googleapis.com/vpc-access-connector: projects/1234567890/locations/us-east1/connectors/staging
        run.googleapis.com/vpc-access-egress: private-ranges-only
    spec:
      taskCount: 1
      parallelism: 1
      template:
        spec:
          maxRetries: 3
          timeoutSeconds: '600'
          serviceAccountName: migrations@pymc-daimon-staging.iam.gserviceaccount.com
          containers:
            - image: us-east1-docker.pkg.dev/pymc-daimon-staging/staging-daimon/daimon@sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
              env:
                - name: DAIMON_DATABASE__URL
                  valueFrom:
                    secretKeyRef:
                      name: database-url
                      key: latest
                - name: UNRELATED_SECRET
                  valueFrom:
                    secretKeyRef:
                      name: unused
                      key: '2'
              resources:
                limits:
                  cpu: '1'
                  memory: 512Mi
              volumeMounts:
                - name: unused
                  mountPath: /etc/unrelated
          volumes:
            - name: unused
              secret:
                secretName: unused
                items:
                  - key: '2'
                    path: value
